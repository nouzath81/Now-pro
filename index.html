<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Product Catalogue</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">Product Catalogue</div>
    <div class="sub">Mobile price list</div>
  </div>
  <button id="shareBtn" class="iconBtn" title="Share catalogue">↗</button>
</header>

<main>
  <section class="hero">
    <h1>Products</h1>
    <p><span id="count"></span> products available</p>
  </section>

  <div class="searchWrap">
    <span>⌕</span>
    <input id="search" type="search" placeholder="Search product code or description…" autocomplete="off">
    <button id="clearBtn" class="clear">×</button>
  </div>

  <div id="categories" class="chips"></div>
  <div id="products" class="grid"></div>
  <div id="empty" class="empty" hidden>No products found.</div>
</main>

<div id="detail" class="modal" hidden>
  <div class="backdrop"></div>
  <div class="sheet">
    <button id="closeDetail" class="close">×</button>
    <div class="tag" id="detailCat"></div>
    <h2 id="detailCode"></h2>
    <p id="detailDesc"></p>
    <div class="price" id="detailPrice"></div>
    <button id="waBtn" class="wa">Share on WhatsApp</button>
  </div>
</div>

<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
